# ==========================================================================
# EduckTrack - Configuracion base del backend
# Perfil activo por defecto: dev. En contenedor se activa 'docker'.
# ==========================================================================
spring:
  application:
    name: educktrack-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway es la unica fuente de verdad del esquema. Nunca 'update' (RS-02).
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # DECISION DE DISENO (Fase 3): baseline-on-migrate queda en false.
    #
    # En true, ante una base de datos con tablas pero sin historial de Flyway,
    # la herramienta se inventa una linea base y sigue adelante como si el
    # esquema fuera suyo: o se salta migraciones o intenta crear tablas que ya
    # existen. Justo lo contrario de que Flyway sea la unica fuente de verdad
    # del esquema (RS-02), y ademas en silencio.
    #
    # En false, ese caso falla con un error explicito y obliga a mirar que pasa,
    # que es el comportamiento que se quiere. El esquema de EduckTrack siempre
    # nace de estas migraciones, de modo que la opcion no aportaba nada.
    baseline-on-migrate: false
    locations: classpath:db/migration

  mail:
    # Configuracion de correo para notificaciones (RS-08) y para el enlace de
    # recuperacion (RF-64). Valores reales por entorno.
    #
    # Los valores por defecto apuntan a un servidor local de pruebas
    # (MailHog/Mailpit en el 1025), que no pide ni credenciales ni cifrado. En
    # produccion se inyectan MAIL_HOST/PORT/USERNAME/PASSWORD.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Gmail y la mayoria de proveedores exigen autenticacion y STARTTLS en
          # el puerto 587. Se dejan configurables porque un servidor de pruebas
          # local no admite ninguna de las dos cosas y rechazaria la conexion.
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          # Sin limite de tiempo, un servidor de correo que no responde bloquea
          # el hilo que atiende la peticion: quien pide recuperar su contrasena
          # se queda esperando por un fallo que no es suyo.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000


server:
  # Railway/Heroku inyectan el puerto via PORT; localmente cae a 8080.
  port: ${PORT:8080}
  servlet:
    context-path: /

# --- Parametros de aplicacion propios de EduckTrack ---
educktrack:
  correo:
    # Remitente de los correos que envia el sistema. JavaMail falla si no hay
    # ninguno, y Gmail exige que coincida con la cuenta autenticada, de modo que
    # por defecto se usa el propio usuario SMTP.
    remitente: ${MAIL_FROM:${MAIL_USERNAME:no-reply@educktrack.edu.co}}
  # NOTA: la escala de calificacion (RB-03), el porcentaje minimo de asistencia
  # (RB-04) y el maximo de horas por docente (RB-09) ya NO se configuran aqui.
  # Desde la Fase 9 son datos que fija el Rector (RF-59) y viven en la tabla
  # 'parametro_institucional'; se consultan en /api/configuracion/parametros.
  alertas:
    # RF-42 / RF-55: alertas que dependen del calendario. Se revisan una vez al
    # dia a primera hora, antes de la jornada escolar (RNF-11: 6:00 a 18:00).
    cron: ${EDUCKTRACK_ALERTAS_CRON:0 0 7 * * *}
    # Dias de antelacion con que se avisa de una tarea proxima a vencer (RF-42)
    # y del fin del periodo academico (RF-55).
    dias-aviso-tarea: ${EDUCKTRACK_DIAS_AVISO_TAREA:3}
    dias-aviso-cierre: ${EDUCKTRACK_DIAS_AVISO_CIERRE:7}
  seguridad:
    recuperacion:
      # HU-04: el enlace de recuperacion caduca a los 30 minutos y ademas se
      # consume al primer uso. Son dos limites distintos: uno acota cuanto vive
      # la credencial en el buzon, el otro impide reutilizarla mas tarde.
      minutos-validez: ${EDUCKTRACK_RECUPERACION_MINUTOS:30}
      # Pantalla del frontend que recibe el token y pide la nueva contrasena.
      url-base: ${EDUCKTRACK_RECUPERACION_URL:http://localhost:5173/restablecer-password}
      # Limite de solicitudes por cuenta y ventana: sin el, cualquiera puede
      # pedir enlaces en bucle para un correo conocido y llenarle el buzon.
      max-solicitudes: ${EDUCKTRACK_RECUPERACION_MAX:3}
      ventana-minutos: ${EDUCKTRACK_RECUPERACION_VENTANA:15}
      # Dias que se conservan los enlaces ya caducados antes de borrarlos. No se
      # borran al usarlos: un token gastado que reaparece es lo que interesa
      # poder investigar.
      dias-retencion: ${EDUCKTRACK_RECUPERACION_RETENCION:7}
      cron-limpieza: ${EDUCKTRACK_RECUPERACION_CRON_LIMPIEZA:0 30 3 * * *}
  security:
    jwt:
      # DECISION DE DISENO: secreto por defecto solo para dev. En docker/prod
      # se inyecta EDUCKTRACK_JWT_SECRET (Base64, >= 256 bits) via variable de entorno.
      secret: ${EDUCKTRACK_JWT_SECRET:ZGV2LXNlY3JldC1lZHVja3RyYWNrLWNhbWJpYXItZW4tcHJvZHVjY2lvbi0xMjM0NTY3OA==}
      # Expiracion del token (RNF-06: 8 horas de emision).
      expiration-minutes: ${EDUCKTRACK_JWT_EXP_MIN:480}
      issuer: educktrack

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# --- Logging ---
logging:
  level:
    com.educktrack: INFO
    org.hibernate.SQL: WARN
