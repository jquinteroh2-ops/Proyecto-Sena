# ==========================================================================
# EduckTrack - Configuracion base del backend
# Perfil activo por defecto: dev. En contenedor se activa 'docker'.
# ==========================================================================
spring:
  application:
    name: educktrack-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway es la unica fuente de verdad del esquema. Nunca 'update' (RS-02).
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # DECISION DE DISENO (Fase 3): baseline-on-migrate queda en false.
    #
    # En true, ante una base de datos con tablas pero sin historial de Flyway,
    # la herramienta se inventa una linea base y sigue adelante como si el
    # esquema fuera suyo: o se salta migraciones o intenta crear tablas que ya
    # existen. Justo lo contrario de que Flyway sea la unica fuente de verdad
    # del esquema (RS-02), y ademas en silencio.
    #
    # En false, ese caso falla con un error explicito y obliga a mirar que pasa,
    # que es el comportamiento que se quiere. El esquema de EduckTrack siempre
    # nace de estas migraciones, de modo que la opcion no aportaba nada.
    baseline-on-migrate: false
    locations: classpath:db/migration

  mail:
    # Configuracion de correo para notificaciones (RS-08). Valores reales por entorno.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  # Railway/Heroku inyectan el puerto via PORT; localmente cae a 8080.
  port: ${PORT:8080}
  servlet:
    context-path: /

# --- Parametros de aplicacion propios de EduckTrack ---
educktrack:
  alertas:
    # RF-42 / RF-55: alertas que dependen del calendario. Se revisan una vez al
    # dia a primera hora, antes de la jornada escolar (RNF-11: 6:00 a 18:00).
    cron: ${EDUCKTRACK_ALERTAS_CRON:0 0 7 * * *}
    # Dias de antelacion con que se avisa de una tarea proxima a vencer (RF-42)
    # y del fin del periodo academico (RF-55).
    dias-aviso-tarea: ${EDUCKTRACK_DIAS_AVISO_TAREA:3}
    dias-aviso-cierre: ${EDUCKTRACK_DIAS_AVISO_CIERRE:7}
  security:
    jwt:
      # DECISION DE DISENO: secreto por defecto solo para dev. En docker/prod
      # se inyecta EDUCKTRACK_JWT_SECRET (Base64, >= 256 bits) via variable de entorno.
      secret: ${EDUCKTRACK_JWT_SECRET:ZGV2LXNlY3JldC1lZHVja3RyYWNrLWNhbWJpYXItZW4tcHJvZHVjY2lvbi0xMjM0NTY3OA==}
      # Expiracion del token (RNF-06: 8 horas de emision).
      expiration-minutes: ${EDUCKTRACK_JWT_EXP_MIN:480}
      issuer: educktrack

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# --- Logging ---
logging:
  level:
    com.educktrack: INFO
    org.hibernate.SQL: WARN
